name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  APPLICATION_NAME: interactive-adventure-game-app
  ENVIRONMENT_NAME: interactive-adventure-game-env

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest httpx

      - name: Run tests
        run: uv run pytest
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: "mock_key_for_testing"
  
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Deployment Package
        run: |
          cd backend
          zip -r ../deploy.zip . -x "*.git*" "*venv*" "__pycache__*"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          deployment-package-path: deploy.zip
          solution-stack-name: "64bit Amazon Linux 2023 v4.13.1 running Python 3.14"
          option-settings: |
            [
              {
                "Namespace": "aws:autoscaling:launchconfiguration",
                "OptionName": "IamInstanceProfile",
                "Value": "aws-elasticbeanstalk-ec2-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:environment",
                "OptionName": "ServiceRole",
                "Value": "aws-elasticbeanstalk-service-role"
              },
              {
                "Namespace": "aws:ec2:instances",
                "OptionName": "InstanceTypes",
                "Value": "t3.micro"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DB_USER",
                "Value": "${{ secrets.RDS_DB_USER }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DB_PASSWORD",
                "Value": "${{ secrets.RDS_DB_PASSWORD }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DB_HOST",
                "Value": "${{ secrets.RDS_DB_HOST }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DB_PORT",
                "Value": "${{ secrets.RDS_DB_PORT }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DB_NAME",
                "Value": "${{ secrets.RDS_DB_NAME }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DEBUG",
                "Value": "False"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "OPENAI_API_KEY",
                "Value": "${{ secrets.OPENAI_API_KEY }}"
              }


            ]
